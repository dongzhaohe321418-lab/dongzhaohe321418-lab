name: Generate stats terminal

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gen_stats.py"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query { user(login:"dongzhaohe321418-lab") { followers { totalCount } repositories(first:100, ownerAffiliations:OWNER, privacy:PUBLIC) { totalCount nodes { stargazerCount primaryLanguage { name } } } contributionsCollection { totalCommitContributions totalPullRequestContributions } } }' > stats-data.json
      - name: Render stats.svg
        run: python3 scripts/gen_stats.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats terminal"
          git push
