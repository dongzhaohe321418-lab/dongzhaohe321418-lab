<svg width="900" height="252" viewBox="0 0 900 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami: Eric Dong — undergrad researcher, ML × materials science">
  <defs>
    <clipPath id="a1"><rect class="tw a1" x="28" y="52" height="24" width="0"/></clipPath>
    <clipPath id="a2"><rect class="tw a2" x="28" y="108" height="24" width="0"/></clipPath>
    <clipPath id="a3"><rect class="tw a3" x="28" y="164" height="24" width="0"/></clipPath>
    <style>
      .win { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #161b22; }
      .t { font: 500 15px 'SFMono-Regular', 'Fira Code', Consolas, monospace; }
      .prompt { fill: #3fb950; }
      .cmd { fill: #e6edf3; }
      .out { fill: #8b949e; }
      .hl { fill: #58a6ff; }
      .hp { fill: #bc8cff; }

      /* 12s loop — commands type char-by-char, output prints instantly (like a real shell) */
      .tw { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .a1 { animation-name: a1; }
      .a2 { animation-name: a2; }
      .a3 { animation-name: a3; }
      @keyframes a1 { 0%,2%  { width: 0; animation-timing-function: steps(8);  } 8%,96%  { width: 90px; }  98%,100% { width: 0; } }
      @keyframes a2 { 0%,18% { width: 0; animation-timing-function: steps(18); } 26%,96% { width: 190px; } 98%,100% { width: 0; } }
      @keyframes a3 { 0%,38% { width: 0; animation-timing-function: steps(20); } 46%,96% { width: 210px; } 98%,100% { width: 0; } }

      .fd { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .o1 { animation-name: o1; } @keyframes o1 { 0%,9%  {opacity:0} 10%,96% {opacity:1} 98%,100% {opacity:0} }
      .o2 { animation-name: o2; } @keyframes o2 { 0%,27% {opacity:0} 28%,96% {opacity:1} 98%,100% {opacity:0} }
      .o3 { animation-name: o3; } @keyframes o3 { 0%,47% {opacity:0} 48%,96% {opacity:1} 98%,100% {opacity:0} }
      .o4 { animation-name: o4; } @keyframes o4 { 0%,54% {opacity:0} 56%,96% {opacity:1} 98%,100% {opacity:0} }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="250" rx="12" class="win"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v27 h-898 z" class="bar"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" class="t out">eric@github: ~</text>

  <g class="t">
    <g clip-path="url(#a1)">
      <text x="28" y="70"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></text>
    </g>
    <g class="fd o1">
      <text x="28" y="94"><tspan class="hl">Eric Dong</tspan> <tspan class="out">— undergrad researcher · ML × materials science · Cambridge</tspan></text>
    </g>
    <g clip-path="url(#a2)">
      <text x="28" y="126"><tspan class="prompt">$</tspan> <tspan class="cmd">cat research.txt</tspan></text>
    </g>
    <g class="fd o2">
      <text x="28" y="150"><tspan class="out">perovskites · polymer adsorbents · XRD/NMR decoding · </tspan><tspan class="hp">agentic AI with built-in supervision</tspan></text>
    </g>
    <g clip-path="url(#a3)">
      <text x="28" y="182"><tspan class="prompt">$</tspan> <tspan class="cmd">cat philosophy.txt</tspan></text>
    </g>
    <g class="fd o3">
      <text x="28" y="206"><tspan class="hl">reproducibility first, evidence always</tspan> <tspan class="out">— never show a number the ledger can't support</tspan></text>
    </g>
    <g class="fd o4">
      <text x="28" y="230"><tspan class="prompt">$</tspan></text>
      <rect x="46" y="217" width="9" height="17" fill="#e6edf3" class="cursor"/>
    </g>
  </g>
</svg>
