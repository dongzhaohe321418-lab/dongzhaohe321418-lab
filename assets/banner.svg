<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eric Dong — ML, Materials Science, Agentic Systems">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#3fb950;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .title { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .subtitle { font: 400 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .mono { font: 500 14px 'SFMono-Regular', Consolas, monospace; fill: #58a6ff; }
      .fade-in { opacity: 0; animation: fadeUp 1s ease-out forwards; }
      .d1 { animation-delay: 0.2s; }
      .d2 { animation-delay: 0.6s; }
      .d3 { animation-delay: 1.0s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .orbit { transform-origin: 790px 110px; animation: spin 14s linear infinite; }
      .orbit2 { transform-origin: 790px 110px; animation: spin 22s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .beam { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- animated grid dots -->
  <g fill="#30363d">
    <circle cx="60" cy="185" r="2" class="pulse"/>
    <circle cx="120" cy="195" r="2" class="pulse" style="animation-delay:.5s"/>
    <circle cx="200" cy="188" r="2" class="pulse" style="animation-delay:1s"/>
    <circle cx="290" cy="196" r="2" class="pulse" style="animation-delay:1.5s"/>
    <circle cx="380" cy="186" r="2" class="pulse" style="animation-delay:2s"/>
  </g>

  <!-- text -->
  <text x="52" y="82" class="title fade-in d1">Eric Dong</text>
  <text x="52" y="118" class="subtitle fade-in d2">ML &#215; Materials Science &#215; Agentic Systems</text>
  <text x="52" y="156" class="mono fade-in d3">&gt; building AI that discovers materials — and audits itself_</text>

  <!-- animated accent underline -->
  <rect x="52" y="94" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="210" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- molecule / orbit motif: atom with two electron orbits -->
  <g>
    <circle cx="790" cy="110" r="10" fill="url(#accent)"/>
    <ellipse cx="790" cy="110" rx="62" ry="24" fill="none" stroke="#30363d" stroke-width="1.5" transform="rotate(-20 790 110)"/>
    <ellipse cx="790" cy="110" rx="62" ry="24" fill="none" stroke="#30363d" stroke-width="1.5" transform="rotate(50 790 110)"/>
    <g class="orbit">
      <circle cx="790" cy="50" r="5" fill="#58a6ff"/>
    </g>
    <g class="orbit2">
      <circle cx="734" cy="140" r="5" fill="#bc8cff"/>
    </g>
    <!-- audit beam scanning the atom -->
    <line x1="700" y1="185" x2="880" y2="185" stroke="#3fb950" stroke-width="1.5" class="beam"/>
    <text x="700" y="205" class="mono" style="fill:#3fb950; font-size:11px;">audit: PASS &#10003;</text>
  </g>
</svg>
