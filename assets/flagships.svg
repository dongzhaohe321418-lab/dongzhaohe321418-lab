<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flagship repositories">
  <defs>
    <linearGradient id="acc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <style>
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .name { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
      .desc { font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .meta { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .in { opacity: 0; animation: pop .7s cubic-bezier(.22,1,.36,1) forwards; }
      .i1 { animation-delay: .1s; } .i2 { animation-delay: .25s; }
      .i3 { animation-delay: .4s; } .i4 { animation-delay: .55s; }
      .i5 { animation-delay: .7s; } .i6 { animation-delay: .85s; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .bar { animation: grow 1s cubic-bezier(.22,1,.36,1) forwards; transform: scaleY(0); transform-origin: center; }
      @keyframes grow { to { transform: scaleY(1); } }
      .shine { animation: shine 5s ease-in-out infinite; }
      @keyframes shine { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- crossaudit_v4 -->
  <g class="in i1">
    <rect x="0" y="0" width="443" height="88" rx="10" class="card"/>
    <rect x="0" y="8" width="4" height="72" rx="2" fill="url(#acc)" class="bar shine"/>
    <text x="20" y="28" class="name">🛡️ crossaudit_v4</text>
    <text x="20" y="50" class="desc">Cross-vendor AI generate→audit loop · cryptographic receipts</text>
    <text x="20" y="70" class="desc">~61k lines · Python stdlib-first · 620+ tests</text>
    <circle cx="360" cy="24" r="5" fill="#3572A5"/><text x="371" y="28" class="meta">Python</text>
  </g>

  <!-- crossaudit -->
  <g class="in i2">
    <rect x="457" y="0" width="443" height="88" rx="10" class="card"/>
    <rect x="457" y="8" width="4" height="72" rx="2" fill="url(#acc)" class="bar shine" style="animation-delay:.3s"/>
    <text x="477" y="28" class="name">🔁 crossaudit</text>
    <text x="477" y="50" class="desc">Where it began — two adversarial agents, one conversation,</text>
    <text x="477" y="70" class="desc">one replayable ledger</text>
    <circle cx="817" cy="24" r="5" fill="#3572A5"/><text x="828" y="28" class="meta">Python</text>
  </g>

  <!-- labscope -->
  <g class="in i3">
    <rect x="0" y="104" width="443" height="88" rx="10" class="card"/>
    <rect x="0" y="112" width="4" height="72" rx="2" fill="url(#acc)" class="bar shine" style="animation-delay:.6s"/>
    <text x="20" y="132" class="name">🔭 labscope</text>
    <text x="20" y="154" class="desc">Instrument-procurement intelligence · 仪器采购情报</text>
    <text x="20" y="174" class="desc">Gas-analyzer specs + real-time literature evidence</text>
    <circle cx="360" cy="128" r="5" fill="#3572A5"/><text x="371" y="132" class="meta">Python</text>
  </g>

  <!-- materials-simulation-handbook -->
  <g class="in i4">
    <rect x="457" y="104" width="443" height="88" rx="10" class="card"/>
    <rect x="457" y="112" width="4" height="72" rx="2" fill="url(#acc)" class="bar shine" style="animation-delay:.9s"/>
    <text x="477" y="132" class="name">🧪 materials-simulation-handbook</text>
    <text x="477" y="154" class="desc">Materials modelling &amp; simulation, undergraduate level</text>
    <text x="477" y="174" class="desc">DFT → MLIPs → Molecular Dynamics · ⭐ 3</text>
    <circle cx="817" cy="128" r="5" fill="#3572A5"/><text x="828" y="132" class="meta">Python</text>
  </g>

  <!-- programming-handbook -->
  <g class="in i5">
    <rect x="0" y="208" width="443" height="88" rx="10" class="card"/>
    <rect x="0" y="216" width="4" height="72" rx="2" fill="url(#acc)" class="bar shine" style="animation-delay:1.2s"/>
    <text x="20" y="236" class="name">💻 programming-handbook</text>
    <text x="20" y="258" class="desc">Zero-foundation: bits &amp; binary → data structures &amp; algorithms</text>
    <text x="20" y="278" class="desc">Python you can run in the browser</text>
    <circle cx="360" cy="232" r="5" fill="#e34c26"/><text x="371" y="236" class="meta">HTML</text>
  </g>

  <!-- more -->
  <g class="in i6">
    <rect x="457" y="208" width="443" height="88" rx="10" class="card" stroke-dasharray="6 4"/>
    <text x="477" y="248" class="name" style="fill:#8b949e">→ and 10+ more</text>
    <text x="477" y="270" class="desc">zemax-mcp · nmr-ssl · xrd-ssl · perovskite-screening · matsci-env</text>
  </g>
</svg>
