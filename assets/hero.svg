<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ERIC DONG — sys online — ML × materials science × agentic systems">
  <defs>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2230"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#58a6ff" flood-opacity="0.18"/>
    </filter>
    <style>
      .name { font: 700 46px 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #e6edf3; letter-spacing: 2px; }
      .ghost { font: 700 46px 'SFMono-Regular', 'Fira Code', Consolas, monospace; letter-spacing: 2px; opacity: 0; }
      .sub { font: 500 14px 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #8b949e; letter-spacing: 1px; }
      .sys { font: 600 13px 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #3fb950; letter-spacing: 1px; }
      .hud { stroke: #58a6ff; stroke-width: 1.5; fill: none; opacity: .5; }

      /* glitch: quiet most of the cycle, twitches at 70-76% */
      .g1 { animation: g1 5s steps(2) infinite; }
      .g2 { animation: g2 5s steps(2) infinite; }
      .base { animation: gb 5s steps(2) infinite; }
      @keyframes g1 { 0%,69%,77%,100% { opacity: 0; transform: translate(0,0); } 70%,73% { opacity: .85; transform: translate(-3px,1px); } 74%,76% { opacity: .85; transform: translate(2px,-1px); } }
      @keyframes g2 { 0%,69%,77%,100% { opacity: 0; transform: translate(0,0); } 70%,73% { opacity: .85; transform: translate(3px,-1px); } 74%,76% { opacity: .85; transform: translate(-2px,1px); } }
      @keyframes gb { 0%,69%,77%,100% { transform: translate(0,0); } 70%,76% { transform: translate(1px,0); } }

      .pulse { animation: pl 2.4s ease-in-out infinite; }
      @keyframes pl { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      .flow { stroke-dasharray: 10 14; animation: fl 1.6s linear infinite; }
      @keyframes fl { to { stroke-dashoffset: -24; } }

      .fade { opacity: 0; animation: fu 1s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; }
      @keyframes fu { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="148" rx="12" fill="#0d1117" stroke="#30363d" filter="url(#glow)"/>
  <rect x="1" y="1" width="898" height="148" rx="12" fill="url(#grid)" opacity=".6"/>
  <rect x="1" y="1" width="898" height="148" rx="12" fill="none" stroke="url(#edge)" opacity=".45"/>

  <!-- HUD corner brackets -->
  <path d="M22 34 v-12 h12" class="hud"/>
  <path d="M878 34 v-12 h-12" class="hud"/>
  <path d="M22 116 v12 h12" class="hud"/>
  <path d="M878 116 v12 h-12" class="hud"/>

  <!-- glitch name: two RGB-split ghosts + base -->
  <g class="fade d1">
    <text x="52" y="78" class="ghost g1" style="fill:#58a6ff">ERIC DONG</text>
    <text x="52" y="78" class="ghost g2" style="fill:#bc8cff">ERIC DONG</text>
    <text x="52" y="78" class="name base">ERIC DONG</text>
  </g>
  <g class="fade d2">
    <text x="52" y="112" class="sub">ml × materials science × agentic systems</text>
  </g>

  <!-- sys status -->
  <g>
    <circle cx="712" cy="60" r="4.5" fill="#3fb950" class="pulse"/>
    <text x="726" y="65" class="sys">SYS ONLINE</text>
    <text x="712" y="90" class="sub" style="font-size:12px">audit loop · armed</text>
  </g>

  <!-- data flow line -->
  <line x1="52" y1="132" x2="848" y2="132" stroke="url(#edge)" stroke-width="1.5" class="flow" opacity=".7"/>
</svg>
