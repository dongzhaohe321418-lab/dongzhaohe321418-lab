<svg width="900" height="538" viewBox="0 0 900 538" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tree ~/projects: crossaudit-app, crossaudit_v4, crossaudit, zemax-mcp, nmr-ssl, xrd-ssl, perovskite-screening, labscope, materials-simulation-handbook, programming-handbook, matsci-env, photo-portfolio">
  <defs>
    <clipPath id="p1"><rect class="tw p1" x="28" y="52" height="24" width="0"/></clipPath>
    <clipPath id="wc"><rect x="1" y="1" width="898" height="536" rx="12"/></clipPath>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="crtg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bb4ff" stop-opacity="0"/><stop offset="50%" stop-color="#8bb4ff" stop-opacity=".045"/><stop offset="100%" stop-color="#8bb4ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2230"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#58a6ff" flood-opacity="0.15"/>
    </filter>
    <style>
      .pulse2 { animation: pl2 2.4s ease-in-out infinite; }
      @keyframes pl2 { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      .crt { animation: crt 9s linear infinite; }
      @keyframes crt { from { transform: translateY(-80px); } to { transform: translateY(618px); } }
      .win { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #161b22; }
      .t { font: 500 15px 'SFMono-Regular', 'Fira Code', Consolas, monospace; }
      .prompt { fill: #3fb950; }
      .cmd { fill: #e6edf3; }
      .dir { fill: #58a6ff; font-weight: 700; }
      .grp { fill: #bc8cff; font-weight: 700; }
      .out { fill: #8b949e; }
      .tree { fill: #30363d; }
      .star { fill: #d29922; }

      /* 16s loop — command types, tree prints group by group */
      .tw { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .p1 { animation-name: p1; }
      @keyframes p1 { 0%,2% { width: 0; animation-timing-function: steps(25); } 10%,96% { width: 280px; } 98%,100% { width: 0; } }

      .fd { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .b1 { animation-name: b1; } @keyframes b1 { 0%,12% {opacity:0} 13%,96% {opacity:1} 98%,100% {opacity:0} }
      .b2 { animation-name: b2; } @keyframes b2 { 0%,22% {opacity:0} 23%,96% {opacity:1} 98%,100% {opacity:0} }
      .b3 { animation-name: b3; } @keyframes b3 { 0%,32% {opacity:0} 33%,96% {opacity:1} 98%,100% {opacity:0} }
      .b4 { animation-name: b4; } @keyframes b4 { 0%,42% {opacity:0} 44%,96% {opacity:1} 98%,100% {opacity:0} }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="536" rx="12" class="win" filter="url(#glow)"/>
  <rect x="1" y="1" width="898" height="536" rx="12" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="898" height="536" rx="12" fill="none" stroke="url(#edge)" opacity=".4"/>
  <g clip-path="url(#wc)"><rect x="1" y="0" width="898" height="70" fill="url(#crtg)" class="crt"/></g>
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v27 h-898 z" class="bar"/>
  <circle cx="856" cy="21" r="4" fill="#3fb950" class="pulse2"/>
  <text x="866" y="25" class="t prompt" style="font-size:11px">live</text>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" class="t out">eric@github: ~/projects</text>

  <g class="t">
    <g clip-path="url(#p1)">
      <text x="28" y="70"><tspan class="prompt">$</tspan> <tspan class="cmd">tree ~/projects --featured</tspan></text>
    </g>

    <!-- group 1: AI infrastructure -->
    <g class="fd b1">
      <text x="28" y="102" class="grp">ai-infrastructure/</text>
      <text x="28" y="128"><tspan class="tree">├─</tspan></text><circle cx="70" cy="123" r="4" fill="#3572A5"/><text x="82" y="128"><tspan class="dir">crossaudit-app</tspan><tspan class="star" x="360">latest</tspan><tspan class="out" x="425">cross-vendor AI audit · macOS app + site</tspan></text>
      <text x="28" y="154"><tspan class="tree">├─</tspan></text><circle cx="70" cy="149" r="4" fill="#3572A5"/><text x="82" y="154"><tspan class="dir">crossaudit_v4</tspan><tspan class="out" x="380">the engine · 61k lines · 620+ tests · receipts</tspan></text>
      <text x="28" y="180"><tspan class="tree">├─</tspan></text><circle cx="70" cy="175" r="4" fill="#3572A5"/><text x="82" y="180"><tspan class="dir">crossaudit</tspan><tspan class="out" x="380">where it began · two adversarial agents, one ledger</tspan></text>
      <text x="28" y="206"><tspan class="tree">└─</tspan></text><circle cx="70" cy="201" r="4" fill="#DA5B0B"/><text x="82" y="206"><tspan class="dir">zemax-mcp</tspan><tspan class="out" x="380">Ansys Zemax OpticStudio driven by AI agents · MCP</tspan></text>
    </g>

    <!-- group 2: ML for science -->
    <g class="fd b2">
      <text x="28" y="238" class="grp">ml-for-science/</text>
      <text x="28" y="264"><tspan class="tree">├─</tspan></text><circle cx="70" cy="259" r="4" fill="#3572A5"/><text x="82" y="264"><tspan class="dir">nmr-ssl</tspan><tspan class="out" x="380">sort-match SSL for NMR shift prediction · conformal</tspan></text>
      <text x="28" y="290"><tspan class="tree">├─</tspan></text><circle cx="70" cy="285" r="4" fill="#3572A5"/><text x="82" y="290"><tspan class="dir">xrd-ssl</tspan><tspan class="out" x="380">self-supervised XRD pattern decoding</tspan></text>
      <text x="28" y="316"><tspan class="tree">├─</tspan></text><circle cx="70" cy="311" r="4" fill="#3572A5"/><text x="82" y="316"><tspan class="dir">perovskite-screening</tspan><tspan class="out" x="380">ML screening + immutable audit artifacts</tspan></text>
      <text x="28" y="342"><tspan class="tree">└─</tspan></text><circle cx="70" cy="337" r="4" fill="#3572A5"/><text x="82" y="342"><tspan class="dir">labscope</tspan><tspan class="out" x="380">instrument intel · live literature evidence · 仪器采购情报</tspan></text>
    </g>

    <!-- group 3: handbooks, env, creative -->
    <g class="fd b3">
      <text x="28" y="374" class="grp">handbooks-env-creative/</text>
      <text x="28" y="400"><tspan class="tree">├─</tspan></text><circle cx="70" cy="395" r="4" fill="#3572A5"/><text x="82" y="400"><tspan class="dir">materials-simulation-handbook</tspan><tspan class="star" x="380">⭐3</tspan><tspan class="out"> DFT → MLIPs → MD</tspan></text>
      <text x="28" y="426"><tspan class="tree">├─</tspan></text><circle cx="70" cy="421" r="4" fill="#e34c26"/><text x="82" y="426"><tspan class="dir">programming-handbook</tspan><tspan class="out" x="380">zero-foundation CS · Python in the browser</tspan></text>
      <text x="28" y="452"><tspan class="tree">├─</tspan></text><circle cx="70" cy="447" r="4" fill="#89e051"/><text x="82" y="452"><tspan class="dir">matsci-env</tspan><tspan class="out" x="380">3 commands to a DFT / MLIP / MD stack</tspan></text>
      <text x="28" y="478"><tspan class="tree">└─</tspan></text><circle cx="70" cy="473" r="4" fill="#3178c6"/><text x="82" y="478"><tspan class="dir">photo-portfolio</tspan><tspan class="out" x="380">Next.js · glassmorphism · cinematic scroll</tspan></text>
    </g>

    <g class="fd b4">
      <text x="28" y="516"><tspan class="prompt">$</tspan></text>
      <rect x="46" y="503" width="9" height="17" fill="#e6edf3" class="cursor"/>
    </g>
  </g>
</svg>
